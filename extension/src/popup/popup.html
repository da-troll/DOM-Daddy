<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DOM Daddy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="header__row">
      <h1>DOM Daddy</h1>
      <div class="header__right">
        <span id="status" class="status">Detecting…</span>
        <button type="button" id="refresh-btn" class="refresh" title="Re-read the page" aria-label="Re-read the page">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </div>
    <p id="meta-title" class="title" hidden></p>
    <p id="meta-sub" class="subtitle" hidden></p>
  </header>

  <main>
    <p id="hint" class="hint" hidden></p>
    <button id="hint-action" class="hint-action" hidden>Take me there</button>

    <div class="mode" id="mode" role="group" aria-label="Button action" hidden>
      <button type="button" class="mode__opt" data-mode="download" id="mode-download" aria-pressed="false">Download</button>
      <button type="button" class="mode__opt is-active" data-mode="clipboard" id="mode-clipboard" aria-pressed="true">Copy</button>
    </div>

    <section class="formats" id="formats" hidden>
      <button class="fmt fmt--analyze" id="analyze-btn" hidden>Analyze Page</button>
      <button class="fmt" data-format="md" id="default-fmt" hidden>Markdown</button>
      <button class="fmt" data-format="txt" hidden>Text</button>
      <button class="fmt" data-format="json" hidden>JSON</button>
      <button class="fmt" data-format="csv" hidden>CSV</button>
    </section>

    <label class="option" id="options" hidden>
      <input type="checkbox" id="opt-reasoning" checked>
      <span>Include reasoning blocks</span>
    </label>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
